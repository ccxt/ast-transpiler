name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
      - "**.cs"
      - "examples/"
      - ".npmignore"
      - ".gitignore"
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-hack
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: go build ./tests/integration/go # debug just to download the go version, do this properly todo!
      - name: Test
        # coverage costs several seconds per suite; only the master badge step reads it
        run: npm run test-ci -- ${{ github.ref == 'refs/heads/master' && '--coverage' || '' }}
      - name: Integration test
        run: npm run integration
      - name: Generate supported.md
        run: npm run generate-supported
      - name: Generating coverage badges
        if: github.ref == 'refs/heads/master'
        uses: jpb06/jest-badges-action@latest
        with:
          branches: master
